<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Diary App</title>
    <meta name="description" content="A simple diary application to store your notes.">
    <style>
        :root {
            --background-color: #ffffff;
            --text-color: #333333;
            --primary-color: #4CAF50;
            --primary-dark-color: #388E3C;
            --secondary-color: #f0f0f0;
            --border-color: #cccccc;
            --card-background: #ffffff;
            --error-color: #d32f2f;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background-color: #1a1a1a;
                --text-color: #e0e0e0;
                --primary-color: #66BB6A;
                --primary-dark-color: #4CAF50;
                --secondary-color: #2a2a2a;
                --border-color: #555555;
                --card-background: #2a2a2a;
                --error-color: #ef5350;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin-bottom: 20px;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        form {
            background-color: var(--card-background);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
        }

        form h2 {
            color: var(--primary-color);
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--text-color);
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-size: 1em;
            background-color: var(--background-color);
            color: var(--text-color);
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s ease, transform 0.2s ease;
            width: 100%;
            font-weight: bold;
        }

        button:hover {
            background-color: var(--primary-dark-color);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .button-group button {
            flex: 1;
        }

        .button-group button.cancel-button {
            background-color: #6c757d;
        }

        .button-group button.cancel-button:hover {
            background-color: #5a6268;
        }

        #notes-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .note-card {
            background-color: var(--card-background);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .note-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.12);
        }

        .note-card h3 {
            color: var(--primary-color);
            margin-bottom: 10px;
            font-size: 1.4em;
            word-wrap: break-word;
        }

        .note-card p {
            font-size: 0.95em;
            color: var(--text-color);
            margin-bottom: 15px;
            flex-grow: 1;
            word-wrap: break-word;
        }

        .note-card .timestamp {
            font-size: 0.8em;
            color: #888;
            margin-bottom: 15px;
            text-align: right;
        }

        .note-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .note-actions button {
            flex: 1;
            padding: 8px 12px;
            font-size: 0.9em;
            border-radius: 4px;
        }

        .note-actions .edit-button {
            background-color: #2196F3; /* Blue */
        }

        .note-actions .edit-button:hover {
            background-color: #1976D2;
        }

        .note-actions .delete-button {
            background-color: #F44336; /* Red */
        }

        .note-actions .delete-button:hover {
            background-color: #D32F2F;
        }

        .message {
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        .message.show {
            opacity: 1;
        }

        .message.success {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }

        .message.error {
            background-color: #ffebee;
            color: var(--error-color);
            border: 1px solid #ef9a9a;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            h1 {
                font-size: 2em;
            }

            form {
                padding: 15px;
            }

            .button-group {
                flex-direction: column;
            }

            .note-actions {
                flex-direction: column;
            }

            #notes-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>My Diary Notes</h1>

        <div id="message-area" class="message"></div>

        <form id="note-form">
            <h2 id="form-title">Add New Note</h2>
            <input type="hidden" id="note-id">
            <div class="form-group">
                <label for="note-title">Title:</label>
                <input type="text" id="note-title" required maxlength="100">
            </div>
            <div class="form-group">
                <label for="note-content">Content:</label>
                <textarea id="note-content" required maxlength="1000"></textarea>
            </div>
            <div class="button-group">
                <button type="submit" id="submit-button">Add Note</button>
                <button type="button" id="cancel-button" class="cancel-button" style="display: none;">Cancel Edit</button>
            </div>
        </form>

        <h2>Your Notes</h2>
        <div id="notes-list">
            <!-- Notes will be loaded here -->
        </div>
    </div>

    <script>
        const noteForm = document.getElementById('note-form');
        const noteIdInput = document.getElementById('note-id');
        const noteTitleInput = document.getElementById('note-title');
        const noteContentInput = document.getElementById('note-content');
        const submitButton = document.getElementById('submit-button');
        const cancelButton = document.getElementById('cancel-button');
        const formTitle = document.getElementById('form-title');
        const notesList = document.getElementById('notes-list');
        const messageArea = document.getElementById('message-area');

        async function showMessage(text, type = 'success') {
            messageArea.textContent = text;
            messageArea.className = 'message ' + type + ' show';
            setTimeout(() => {
                messageArea.className = 'message';
                messageArea.textContent = '';
            }, 3000);
        }

        function clearForm() {
            noteIdInput.value = '';
            noteTitleInput.value = '';
            noteContentInput.value = '';
            submitButton.textContent = 'Add Note';
            formTitle.textContent = 'Add New Note';
            cancelButton.style.display = 'none';
        }

        async function fetchNotes() {
            try {
                const response = await fetch('/notes');
                if (!response.ok) {
                    throw new Error('Failed to fetch notes: ' + response.statusText);
                }
                const notes = await response.json();
                notesList.textContent = ''; // Clear existing notes

                if (notes.length === 0) {
                    notesList.innerHTML = '<p style="text-align: center; color: var(--text-color);">No notes yet. Start by adding one!</p>';
                    return;
                }

                // Sort notes by timestamp in descending order
                notes.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

                notes.forEach(note => {
                    const noteCard = document.createElement('div');
                    noteCard.className = 'note-card';
                    noteCard.setAttribute('data-id', note.id);

                    const title = document.createElement('h3');
                    title.textContent = note.title;

                    const content = document.createElement('p');
                    content.textContent = note.content;

                    const timestamp = document.createElement('div');
                    timestamp.className = 'timestamp';
                    timestamp.textContent = new Date(note.timestamp).toLocaleString();

                    const actions = document.createElement('div');
                    actions.className = 'note-actions';

                    const editButton = document.createElement('button');
                    editButton.className = 'edit-button';
                    editButton.textContent = 'Edit';
                    editButton.addEventListener('click', () => editNote(note.id, note.title, note.content));

                    const deleteButton = document.createElement('button');
                    deleteButton.className = 'delete-button';
                    deleteButton.textContent = 'Delete';
                    deleteButton.addEventListener('click', () => deleteNote(note.id));

                    actions.appendChild(editButton);
                    actions.appendChild(deleteButton);

                    noteCard.appendChild(title);
                    noteCard.appendChild(content);
                    noteCard.appendChild(timestamp);
                    noteCard.appendChild(actions);
                    notesList.appendChild(noteCard);
                });
            } catch (error) {
                console.error('Error fetching notes:', error);
                showMessage('Error loading notes: ' + error.message, 'error');
            }
        }

        async function addOrUpdateNote(event) {
            event.preventDefault();

            const id = noteIdInput.value;
            const title = noteTitleInput.value.trim();
            const content = noteContentInput.value.trim();

            if (!title || !content) {
                showMessage('Title and content cannot be empty.', 'error');
                return;
            }

            const method = id ? 'PUT' : 'POST';
            const url = id ? '/notes/' + id : '/notes';

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ title, content }),
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Failed to save note');
                }

                showMessage(data.message || (id ? 'Note updated successfully!' : 'Note added successfully!'), 'success');
                clearForm();
                fetchNotes();
            } catch (error) {
                console.error('Error saving note:', error);
                showMessage('Error saving note: ' + error.message, 'error');
            }
        }

        function editNote(id, title, content) {
            noteIdInput.value = id;
            noteTitleInput.value = title;
            noteContentInput.value = content;
            submitButton.textContent = 'Update Note';
            formTitle.textContent = 'Edit Note';
            cancelButton.style.display = 'inline-block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deleteNote(id) {
            if (!confirm('Are you sure you want to delete this note?')) {
                return;
            }

            try {
                const response = await fetch('/notes/' + id, {
                    method: 'DELETE',
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Failed to delete note');
                }

                showMessage(data.message || 'Note deleted successfully!', 'success');
                fetchNotes();
            } catch (error) {
                console.error('Error deleting note:', error);
                showMessage('Error deleting note: ' + error.message, 'error');
            }
        }

        noteForm.addEventListener('submit', addOrUpdateNote);
        cancelButton.addEventListener('click', clearForm);

        // Initial fetch of notes
        document.addEventListener('DOMContentLoaded', fetchNotes);
    </script>
</body>
</html>
